[package]
name = "schematic-manager"
version = "0.1.2"
description = "跨平台 Minecraft 投影(.litematic)文件管理与预览工具"
authors = ["heiheids"]
edition = "2021"
rust-version = "1.77"
license = "AGPL-3.0-only"

[lib]
name = "schematic_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
thiserror = "2"
ureq = "2.12"
chrono = "0.4"
rfd = "0.14"
native-dialog = "0.9.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Controls",  "Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
